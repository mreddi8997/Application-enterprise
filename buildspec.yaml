version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      java: corretto21
    commands:
      - npm install --global "snyk@${SNYK_CLI_VERSION:?Set SNYK_CLI_VERSION}"

  build:
    commands:
      - bash ./mvnw -B clean verify
      - snyk test --file=pom.xml --severity-threshold=high

    post_build:
    commands:
      - |
        set -euo pipefail
        [[ "${CODEBUILD_BUILD_SUCCEEDING:-0}" == "1" ]]

        shopt -s nullglob
        jars=(target/spring-petclinic-*.jar)
        if [[ ${#jars[@]} -ne 1 ]]; then
          echo "Expected exactly one Petclinic JAR." >&2
          exit 1
        fi

        mkdir -p target/release
        cp -R deploy/. target/release/
        cp "${jars[0]}" target/release/app.jar

artifacts:
  base-directory: target/release
  files:
    - '**/*'
